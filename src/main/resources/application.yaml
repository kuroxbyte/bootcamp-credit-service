server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: credit-service
  mongodb:
    # Una base de datos por microservicio; se puede sobrescribir con la variable MONGODB_URI.
    uri: ${MONGODB_URI:mongodb://localhost:27017/credit_db}
  data:
    mongodb:
      # Crea los índices declarados con @Indexed en los documentos.
      auto-index-creation: true

clients:
  customer-service:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    timeout: 3s
