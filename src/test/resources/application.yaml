# Configuración de las pruebas: no se consulta config-server.
spring:
  config:
    # Toma la configuración común (circuit breaker y timeout) de config-repo.
    import: optional:file:../config-repo/application.yaml
  application:
    name: credit-service
  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false
  mongodb:
    uri: mongodb://localhost:27017/credit_test_db

clients:
  customer-service:
    base-url: http://localhost:8081
    timeout: 3s

eureka:
  client:
    # Las pruebas no se registran en Eureka.
    enabled: false
