# Configuración de las pruebas: no se consulta config-server.
spring:
  config:
    # Toma la configuración común (circuit breaker y timeout) de config-repo.
    import: optional:file:../config-repo/application.yaml
  application:
    name: credit-service
  cloud:
    config:
      enabled: false
  mongodb:
    uri: mongodb://localhost:27017/credit_test_db
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      # Las pruebas no crean tópicos ni esperan a un broker.
      auto-create: false
    listener:
      # El consumidor se prueba directamente, sin broker.
      auto-startup: false

messaging:
  topics:
    credit-events: credit-events
    debt-events: debt-events

cache:
  debt-status:
    ttl: 10m

clients:
  customer-service:
    base-url: http://customer-service
    timeout: 3s
  transaction-service:
    base-url: http://transaction-service

eureka:
  client:
    # Las pruebas no se registran en Eureka.
    enabled: false
